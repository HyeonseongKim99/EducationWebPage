services:
  education-web:
    image: ghcr.io/hyeonseongkim99/educationwebpage:latest
    container_name: education-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - "${COURSES_PATH}:/srv/courses:ro"
    environment:
      SITE_URL: "${SITE_URL:-http://localhost}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-auto}"
      CONTENT_AUTO_REFRESH: "${CONTENT_AUTO_REFRESH:-true}"
      CONTENT_POLL_SECONDS: "${CONTENT_POLL_SECONDS:-60}"
      CONTENT_SETTLE_SECONDS: "${CONTENT_SETTLE_SECONDS:-15}"
    security_opt:
      - no-new-privileges:true
